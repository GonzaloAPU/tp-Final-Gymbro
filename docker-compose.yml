services:
  # 1. Base de datos PostgreSQL
  postgres:
    image: postgres:17-alpine
    container_name: gymbro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartgymbro_tp
      POSTGRES_USER: smartgymbro_tp
      POSTGRES_PASSWORD: smartgymbro_tp
    ports:
      - "55433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U smartgymbro_tp -d smartgymbro_tp" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gymbro-net

  # 2. Administrador pgAdmin 4
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gymbro-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gymbro-net

  # 3. Servidor Backend API (Node.js 26)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: smartgymbro-backend:latest
    container_name: gymbro-backend
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      - PORT=3100
      - NODE_ENV=production
      - DB_CONNECTION_MODE=LOCAL
      - DB_SCHEMA=gymbro
      - DB_NAMES_LANGUAGE=es
      - DATABASE_URL=postgres://smartgymbro_tp:smartgymbro_tp@postgres:5432/smartgymbro_tp
      - JWT_SECRET=clave_secreta_super_segura_de_produccion_32_caracteres_minimo
      - FRONTEND_URL=http://localhost:4300
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gymbro-net

  # 4. Servidor Frontend Web (Angular 22 + Nginx)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: smartgymbro-frontend:latest
    container_name: gymbro-frontend
    restart: unless-stopped
    ports:
      - "4300:80"
    depends_on:
      - backend
    networks:
      - gymbro-net

  # 5. Servidor Documental Nextcloud (Autoconfiguración por Hooks occ sin subir volúmenes a Git)
  nextcloud:
    image: nextcloud:29-apache
    container_name: gymbro-nextcloud
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - SQLITE_DATABASE=nextcloud
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD:-smartgymbro_tp}
      - NEXTCLOUD_TEAM_PASSWORD=${NEXTCLOUD_TEAM_PASSWORD:-SmartGym2026!}
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost 127.0.0.1 100.121.22.101 gto-1 nextcloud gymbro-nextcloud
    volumes:
      - nextcloud_data:/var/www/html
      - ./infra/nextcloud/hooks/post-installation:/docker-entrypoint-hooks.d/post-installation:ro
      - ./infra/nextcloud/skeleton:/opt/nextcloud-skeleton:ro
      - ./docs:/opt/project-docs:ro
      - ./infra/incidencias/matriz_amenazas.md:/opt/project-extra/matriz_amenazas.md:ro
      - ./infra/monitoring/README.md:/opt/project-extra/INFORME-MONITOREO.md:ro
    networks:
      - gymbro-net

volumes:
  postgres_data:
  pgadmin_data:
  nextcloud_data:

networks:
  gymbro-net:
    driver: bridge
