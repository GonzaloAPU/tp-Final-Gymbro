services:
  # 1. Base de datos PostgreSQL Primaria (Master)
  postgres:
    image: postgres:17-alpine
    container_name: gymbro-postgres-primary
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "hot_standby=on"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartgymbro_tp}
      POSTGRES_USER: ${POSTGRES_USER:-smartgymbro_tp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
    ports:
      - "${POSTGRES_PORT:-55433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/sql/01-bootstrap.sql:/docker-entrypoint-initdb.d/01-bootstrap.sql:ro
      - ./postgres/sql/08-nombres-espanol.sql:/docker-entrypoint-initdb.d/08-nombres-espanol.sql:ro
      - ./postgres/sql/09-init-replication.sql:/docker-entrypoint-initdb.d/09-init-replication.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartgymbro_tp} -d ${POSTGRES_DB:-smartgymbro_tp}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      gymbro-net:
        aliases:
          - postgres
          - postgres-primary
          - gymbro-postgres-primary

  # 1.1 Nodo Standby (Replica Streaming)
  postgres-replica:
    image: postgres:17-alpine
    container_name: gymbro-postgres-replica
    restart: unless-stopped
    ports:
      - "${POSTGRES_REPLICA_PORT:-55434}:5432"
    environment:
      PGUSER: ${POSTGRES_USER:-smartgymbro_tp}
      PGPASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    networks:
      gymbro-net:
        aliases:
          - postgres-replica
          - gymbro-postgres-replica
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: >
      sh -c "
      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        echo '[REPLICA] Clonando cluster primario mediante pg_basebackup...';
        until PGPASSWORD=${POSTGRES_REPLICATION_PASSWORD:-replicator_password123} pg_basebackup -h postgres-primary -p 5432 -U ${POSTGRES_REPLICATION_USER:-replicator} -D /var/lib/postgresql/data -v -P -X stream -R --slot=standby_slot_1; do
          echo '[REPLICA] Esperando disponibilidad del nodo primario...';
          sleep 2;
        done;
        echo 'hot_standby = on' >> /var/lib/postgresql/data/postgresql.auto.conf;
        chown -R postgres:postgres /var/lib/postgresql/data;
        chmod 700 /var/lib/postgresql/data;
        echo '[REPLICA] Clonacion exitosa. Iniciando modo Hot Standby...';
      fi;
      exec gosu postgres postgres
      "

  # 1.2 Servicio Daemon de Backups Automaticos
  postgres-backup:
    image: postgres:17-alpine
    container_name: gymbro-postgres-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres-primary
      PGUSER: ${POSTGRES_USER:-smartgymbro_tp}
      PGPASSWORD: ${POSTGRES_PASSWORD:-admin123}
      PGDATABASE: ${POSTGRES_DB:-smartgymbro_tp}
    volumes:
      - ./postgres/backups:/backups
      - ./postgres/scripts/backup-cron.sh:/backup-cron.sh:ro
    networks:
      - gymbro-net
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "/backup-cron.sh"]

  # 2. Administrador pgAdmin 4
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gymbro-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@smartgymbro.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-pgadmin_secure_pass_2026}
    ports:
      - "${PGADMIN_PORT:-5051}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./postgres/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gymbro-net

  # 3. Servidor Backend API (Node.js 26)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: smartgymbro-backend:latest
    container_name: gymbro-backend
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      - PORT=3100
      - NODE_ENV=production
      - DB_CONNECTION_MODE=LOCAL
      - DB_SCHEMA=gymbro
      - DB_NAMES_LANGUAGE=es
      - DATABASE_URL=postgres://${POSTGRES_USER:-smartgymbro_tp}:${POSTGRES_PASSWORD:-admin123}@postgres:5432/${POSTGRES_DB:-smartgymbro_tp}
      - JWT_SECRET=${JWT_SECRET:-super_secreto_local_smartgymbro_2026_seguro_mas_de_32_chars}
      - FRONTEND_URL=http://localhost:4300
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gymbro-net

  # 4. Servidor Frontend Web (Angular 22 + Nginx)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: smartgymbro-frontend:latest
    container_name: gymbro-frontend
    restart: unless-stopped
    ports:
      - "4300:80"
    depends_on:
      - backend
    networks:
      - gymbro-net

  # 5. Servidor Documental Nextcloud (Hooks occ automáticos)
  nextcloud:
    image: nextcloud:29-apache
    container_name: gymbro-nextcloud
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - SQLITE_DATABASE=nextcloud
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD:-smartgymbro_tp}
      - NEXTCLOUD_TEAM_PASSWORD=${NEXTCLOUD_TEAM_PASSWORD:-SmartGym2026!}
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost 127.0.0.1 100.121.22.101 100.83.53.126 aldovictus.tail97f23e.ts.net gto-1 nextcloud gymbro-nextcloud
    volumes:
      - nextcloud_data:/var/www/html
      - ./infra/nextcloud/hooks/post-installation:/docker-entrypoint-hooks.d/post-installation:ro
      - ./infra/nextcloud/skeleton:/opt/nextcloud-skeleton:ro
      - ./docs:/opt/project-docs:ro
      - ./infra/incidencias/matriz_amenazas.md:/opt/project-extra/matriz_amenazas.md:ro
      - ./infra/monitoring/README.md:/opt/project-extra/INFORME-MONITOREO.md:ro
    networks:
      - gymbro-net

  # 6. Base de Datos Mantis Bug Tracker (MySQL 5.7)
  mantis-db:
    image: mysql:5.7
    container_name: mantis-mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_seguro
      MYSQL_DATABASE: ${MANTIS_DB_NAME:-bugtracker}
      MYSQL_USER: ${MANTIS_DB_USER:-mantis_user}
      MYSQL_PASSWORD: ${MANTIS_DB_PASSWORD:-mantis_password_seguro}
    volumes:
      - mantis_db_data:/var/lib/mysql
    networks:
      - gymbro-net

  # 6.1 Panel Web Mantis Bug Tracker
  mantis-web:
    image: vimagick/mantisbt:latest
    container_name: mantis-web-app
    restart: unless-stopped
    ports:
      - "${MANTIS_PORT:-8089}:80"
    environment:
      MANTIS_DB_TYPE: mysqli
      MANTIS_DB_HOST: mantis-db
      MANTIS_DB_USER: ${MANTIS_DB_USER:-mantis_user}
      MANTIS_DB_PASSWORD: ${MANTIS_DB_PASSWORD:-mantis_password_seguro}
      MANTIS_DB_NAME: ${MANTIS_DB_NAME:-bugtracker}
    depends_on:
      - mantis-db
    volumes:
      - ./infra/incidencias/config_inc.php:/var/www/html/config/config_inc.php:ro
    networks:
      - gymbro-net

volumes:
  postgres_data:
  postgres_replica_data:
  pgadmin_data:
  nextcloud_data:
  mantis_db_data:

networks:
  gymbro-net:
    name: gymbro-net
    driver: bridge
