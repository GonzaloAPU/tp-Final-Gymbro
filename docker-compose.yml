services:
  # 1. BALANCEADOR DE CARGA Y ENRUTADOR DE ALTA DISPONIBILIDAD (HAPROXY)
  haproxy:
    image: haproxy:3.2-alpine
    container_name: gymbro-haproxy
    restart: unless-stopped
    volumes:
      - ./postgres/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      # Puerto de escritura mapeado a puerto del host (55433) y estandar Patroni (5000)
      - "${POSTGRES_PORT:-55433}:5000"
      - "5000:5000"
      # Puerto de lectura mapeado a puerto del host (55434) y estandar Patroni (5001)
      - "${POSTGRES_REPLICA_PORT:-55434}:5001"
      - "5001:5001"
      # Panel web interactivo de estado de HAProxy
      - "7000:7000"
    depends_on:
      - db-node1
      - db-node2
      - db-node3
    networks:
      gymbro-net:
        aliases:
          - haproxy
          - postgres
          - postgres-primary
          - gymbro-postgres-primary

  # 2. CLUSTER DE CONSENSO DISTRIBUIDO (ETCD)
  etcd1:
    image: gcr.io/etcd-development/etcd:v3.5.31
    container_name: gymbro-etcd1
    restart: unless-stopped
    command:
      - /usr/local/bin/etcd
      - --name=etcd1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=smartgymbro-etcd
      - --initial-cluster-state=new
    volumes:
      - etcd1_data:/etcd-data
    networks:
      gymbro-net:
        aliases:
          - etcd1

  etcd2:
    image: gcr.io/etcd-development/etcd:v3.5.31
    container_name: gymbro-etcd2
    restart: unless-stopped
    command:
      - /usr/local/bin/etcd
      - --name=etcd2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=smartgymbro-etcd
      - --initial-cluster-state=new
    volumes:
      - etcd2_data:/etcd-data
    networks:
      gymbro-net:
        aliases:
          - etcd2

  etcd3:
    image: gcr.io/etcd-development/etcd:v3.5.31
    container_name: gymbro-etcd3
    restart: unless-stopped
    command:
      - /usr/local/bin/etcd
      - --name=etcd3
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd3:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=smartgymbro-etcd
      - --initial-cluster-state=new
    volumes:
      - etcd3_data:/etcd-data
    networks:
      gymbro-net:
        aliases:
          - etcd3

  # 3. POSTGRESQL ADMINISTRADOS POR PATRONI (AUTO-FAILOVER)
  db-node1:
    build:
      context: ./postgres/patroni
    image: smartgymbro-patroni:17
    container_name: gymbro-db-node1
    restart: unless-stopped
    environment:
      PATRONI_NAME: db-node1
      PATRONI_SCOPE: smartgymbro_cluster
      PATRONI_ETCD3_HOSTS: etcd1:2379,etcd2:2379,etcd3:2379
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: db-node1:5432
      PATRONI_RESTAPI_CONNECT_ADDRESS: db-node1:8008
      PATRONI_SUPERUSER_USERNAME: ${POSTGRES_USER:-smartgymbro_tp}
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      PATRONI_REPLICATION_USERNAME: ${POSTGRES_REPLICATION_USER:-replicator}
      PATRONI_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-replicator_password123}
    volumes:
      - db_node1_data:/var/lib/postgresql/data
      # Tunel de backups logicos bidireccional (host <-> contenedor)
      - ./postgres/backups:/backups
      - ./postgres/sql/01-bootstrap.sql:/docker-entrypoint-initdb.d/01-bootstrap.sql:ro
      - ./postgres/sql/08-nombres-espanol.sql:/docker-entrypoint-initdb.d/08-nombres-espanol.sql:ro
      - ./postgres/sql/09-init-replication.sql:/docker-entrypoint-initdb.d/09-init-replication.sql:ro
    depends_on:
      - etcd1
      - etcd2
      - etcd3
    networks:
      gymbro-net:
        aliases:
          - db-node1

  db-node2:
    build:
      context: ./postgres/patroni
    image: smartgymbro-patroni:17
    container_name: gymbro-db-node2
    restart: unless-stopped
    environment:
      PATRONI_NAME: db-node2
      PATRONI_SCOPE: smartgymbro_cluster
      PATRONI_ETCD3_HOSTS: etcd1:2379,etcd2:2379,etcd3:2379
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: db-node2:5432
      PATRONI_RESTAPI_CONNECT_ADDRESS: db-node2:8008
      PATRONI_SUPERUSER_USERNAME: ${POSTGRES_USER:-smartgymbro_tp}
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      PATRONI_REPLICATION_USERNAME: ${POSTGRES_REPLICATION_USER:-replicator}
      PATRONI_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-replicator_password123}
    volumes:
      - db_node2_data:/var/lib/postgresql/data
      - ./postgres/backups:/backups
      - ./postgres/sql/01-bootstrap.sql:/docker-entrypoint-initdb.d/01-bootstrap.sql:ro
      - ./postgres/sql/08-nombres-espanol.sql:/docker-entrypoint-initdb.d/08-nombres-espanol.sql:ro
      - ./postgres/sql/09-init-replication.sql:/docker-entrypoint-initdb.d/09-init-replication.sql:ro
    depends_on:
      - etcd1
      - etcd2
      - etcd3
    networks:
      gymbro-net:
        aliases:
          - db-node2

  db-node3:
    build:
      context: ./postgres/patroni
    image: smartgymbro-patroni:17
    container_name: gymbro-db-node3
    restart: unless-stopped
    environment:
      PATRONI_NAME: db-node3
      PATRONI_SCOPE: smartgymbro_cluster
      PATRONI_ETCD3_HOSTS: etcd1:2379,etcd2:2379,etcd3:2379
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: db-node3:5432
      PATRONI_RESTAPI_CONNECT_ADDRESS: db-node3:8008
      PATRONI_SUPERUSER_USERNAME: ${POSTGRES_USER:-smartgymbro_tp}
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      PATRONI_REPLICATION_USERNAME: ${POSTGRES_REPLICATION_USER:-replicator}
      PATRONI_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-replicator_password123}
    volumes:
      - db_node3_data:/var/lib/postgresql/data
      - ./postgres/backups:/backups
      - ./postgres/sql/01-bootstrap.sql:/docker-entrypoint-initdb.d/01-bootstrap.sql:ro
      - ./postgres/sql/08-nombres-espanol.sql:/docker-entrypoint-initdb.d/08-nombres-espanol.sql:ro
      - ./postgres/sql/09-init-replication.sql:/docker-entrypoint-initdb.d/09-init-replication.sql:ro
    depends_on:
      - etcd1
      - etcd2
      - etcd3
    networks:
      gymbro-net:
        aliases:
          - db-node3

  # 4. SERVICIO DAEMON DE BACKUPS AUTOMATICOS 
  postgres-backup:
    image: postgres:17-alpine
    container_name: gymbro-postgres-backup
    restart: unless-stopped
    environment:
      PGHOST: haproxy
      PGPORT: 5000
      PGUSER: ${POSTGRES_USER:-smartgymbro_tp}
      PGPASSWORD: ${POSTGRES_PASSWORD:-admin123}
      PGDATABASE: ${POSTGRES_DB:-smartgymbro_tp}
    volumes:
      - ./postgres/backups:/backups
      - ./postgres/scripts/backup-cron.sh:/backup-cron.sh:ro
    networks:
      - gymbro-net
    depends_on:
      - haproxy
    entrypoint: ["sh", "/backup-cron.sh"]

  # 5. ADMINISTRADOR PGADMIN 4
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gymbro-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@smartgymbro.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-pgadmin_secure_pass_2026}
    ports:
      - "${PGADMIN_PORT:-5051}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./postgres/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - haproxy
    networks:
      - gymbro-net

  # 6. SERVIDOR BACKEND API (NODE.JS)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: smartgymbro-backend:latest
    container_name: gymbro-backend
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      - PORT=3100
      - NODE_ENV=production
      - DB_CONNECTION_MODE=LOCAL
      - DB_SCHEMA=gymbro
      - DB_NAMES_LANGUAGE=es
      # Conexion resiliente apuntando a HAProxy (puerto 5000 de escritura)
      - DATABASE_URL=postgres://${POSTGRES_USER:-smartgymbro_tp}:${POSTGRES_PASSWORD:-admin123}@haproxy:5000/${POSTGRES_DB:-smartgymbro_tp}
      - JWT_SECRET=${JWT_SECRET:-super_secreto_local_smartgymbro_2026_seguro_mas_de_32_chars}
      - FRONTEND_URL=http://localhost:4300
    depends_on:
      - haproxy
    networks:
      - gymbro-net

  # 7. SERVIDOR FRONTEND WEB (ANGULAR 22 + NGINX)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: smartgymbro-frontend:latest
    container_name: gymbro-frontend
    restart: unless-stopped
    ports:
      - "4300:80"
    depends_on:
      - backend
    networks:
      - gymbro-net

  # 8. SERVIDOR DOCUMENTAL NEXTCLOUD
  nextcloud:
    image: nextcloud:29-apache
    container_name: gymbro-nextcloud
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - SQLITE_DATABASE=nextcloud
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD:?Definir NEXTCLOUD_ADMIN_PASSWORD en .env}
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost 127.0.0.1 100.121.22.101 100.83.53.126 aldovictus.tail97f23e.ts.net gto-1 nextcloud gymbro-nextcloud
    volumes:
      - nextcloud_data:/var/www/html
      - ./infra/nextcloud/hooks/post-installation:/docker-entrypoint-hooks.d/post-installation:ro
      - ./infra/nextcloud/skeleton:/opt/nextcloud-skeleton:ro
      - ./infra/nextcloud/informes:/opt/project-reports:ro
      - ./docs:/opt/project-docs:ro
      - ./infra/incidencias/matriz_amenazas.md:/opt/project-extra/matriz_amenazas.md:ro
      - ./infra/monitoring/README.md:/opt/project-extra/INFORME-MONITOREO.md:ro
    networks:
      - gymbro-net

  # 9. BASE DE DATOS MANTIS BUG TRACKER (MYSQL 5.7)
  mantis-db:
    image: mysql:5.7
    container_name: mantis-mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_seguro
      MYSQL_DATABASE: ${MANTIS_DB_NAME:-bugtracker}
      MYSQL_USER: ${MANTIS_DB_USER:-mantis_user}
      MYSQL_PASSWORD: ${MANTIS_DB_PASSWORD:-mantis_password_seguro}
    volumes:
      - mantis_db_data:/var/lib/mysql
    networks:
      - gymbro-net

  # 10. PANEL WEB MANTIS BUG TRACKER
  mantis-web:
    image: vimagick/mantisbt:latest
    container_name: mantis-web-app
    restart: unless-stopped
    ports:
      - "${MANTIS_PORT:-8089}:80"
    environment:
      MANTIS_DB_TYPE: mysqli
      MANTIS_DB_HOST: mantis-db
      MANTIS_DB_USER: ${MANTIS_DB_USER:-mantis_user}
      MANTIS_DB_PASSWORD: ${MANTIS_DB_PASSWORD:-mantis_password_seguro}
      MANTIS_DB_NAME: ${MANTIS_DB_NAME:-bugtracker}
    depends_on:
      - mantis-db
    volumes:
      - ./infra/incidencias/config_inc.php:/var/www/html/config/config_inc.php:ro
      - ./infra/incidencias/overrides/access_api.php:/var/www/html/core/access_api.php:ro
      - ./infra/incidencias/overrides/BugFilterQuery.class.php:/var/www/html/core/classes/BugFilterQuery.class.php:ro
      - ./infra/incidencias/overrides/filter_api.php:/var/www/html/core/filter_api.php:ro
      - ./infra/incidencias/plugins/SmartGymBroDashboard:/var/www/html/plugins/SmartGymBroDashboard:ro
    networks:
      - gymbro-net

  # 11. Agente de Despliegue Continuo Automatico (Punto 8 CI/CD)
  # Monitorea los registros de imagenes en la nube cada 60s y actualiza la app en caliente
  watchtower:
    image: containrrr/watchtower:latest
    container_name: gymbro-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
    command: gymbro-frontend gymbro-backend
    networks:
      - gymbro-net

volumes:
  etcd1_data:
  etcd2_data:
  etcd3_data:
  db_node1_data:
  db_node2_data:
  db_node3_data:
  pgadmin_data:
  nextcloud_data:
  mantis_db_data:

networks:
  gymbro-net:
    name: gymbro-net
    driver: bridge
