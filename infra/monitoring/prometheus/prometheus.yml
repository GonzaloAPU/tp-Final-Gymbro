global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node_exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: docker
    static_configs:
      - targets: ['docker-exporter:9189']

  - job_name: postgres_exporter
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: blackbox_backend
    metrics_path: /probe
    params:
      module: [http_2xx]
      target: ["http://host.docker.internal:3100/api/health"]
    static_configs:
      - targets:
          - blackbox-exporter:9115
