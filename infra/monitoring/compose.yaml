services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: gymbro-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - gymbro-monitoring

  grafana:
    image: grafana/grafana:11.1.0
    container_name: gymbro-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - gymbro-monitoring

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: gymbro-node-exporter
    restart: unless-stopped
    pid: host
    ports:
      - "9100:9100"
    networks:
      - gymbro-monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: gymbro-cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - gymbro-monitoring

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: gymbro-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_DATA_SOURCE:-postgresql://smartgymbro_tp:smartgymbro_tp@host.docker.internal:55433/smartgymbro_tp?sslmode=disable}
    ports:
      - "9187:9187"
    networks:
      - gymbro-monitoring

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: gymbro-blackbox-exporter
    restart: unless-stopped
    volumes:
      - ./blackbox.yml:/etc/blackbox.yml:ro
    ports:
      - "9115:9115"
    networks:
      - gymbro-monitoring

volumes:
  prometheus_data:
  grafana_data:

networks:
  gymbro-monitoring:
    driver: bridge
