services:
  mantis-db:
    image: mysql:5.7
    container_name: mantis-mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MANTIS_ROOT_PASSWORD:-root_password_seguro}
      MYSQL_DATABASE: ${MANTIS_DB_NAME:-bugtracker}
      MYSQL_USER: ${MANTIS_DB_USER:-mantis_user}
      MYSQL_PASSWORD: ${MANTIS_DB_PASSWORD:-mantis_password_seguro}
    volumes:
      - mantis_db_data:/var/lib/mysql
    networks:
      - gymbro-net
    restart: always

  mantis-web:
    image: vimagick/mantisbt:latest
    container_name: mantis-web-app
    ports:
      - "${MANTIS_PORT:-8089}:80"
    environment:
      MANTIS_DB_TYPE: mysqli
      MANTIS_DB_HOST: mantis-db
      MANTIS_DB_USER: ${MANTIS_DB_USER:-mantis_user}
      MANTIS_DB_PASSWORD: ${MANTIS_DB_PASSWORD:-mantis_password_seguro}
      MANTIS_DB_NAME: ${MANTIS_DB_NAME:-bugtracker}
    depends_on:
      - mantis-db
    volumes:
      - ./config_inc.php:/var/www/html/config/config_inc.php:ro
      - ./overrides/access_api.php:/var/www/html/core/access_api.php:ro
      - ./overrides/BugFilterQuery.class.php:/var/www/html/core/classes/BugFilterQuery.class.php:ro
      - ./overrides/filter_api.php:/var/www/html/core/filter_api.php:ro
      - ./plugins/SmartGymBroDashboard:/var/www/html/plugins/SmartGymBroDashboard:ro
    networks:
      - gymbro-net
    restart: always

volumes:
  mantis_db_data:

networks:
  gymbro-net:
    external: true
