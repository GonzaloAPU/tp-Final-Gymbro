services:
  nextcloud:
    image: nextcloud:29-apache
    container_name: gymbro-nextcloud
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - SQLITE_DATABASE=nextcloud
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD:?Definir NEXTCLOUD_ADMIN_PASSWORD en .env}
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost 127.0.0.1 100.121.22.101 gto-1 nextcloud gymbro-nextcloud
    volumes:
      - nextcloud_data:/var/www/html
      - ./hooks/post-installation:/docker-entrypoint-hooks.d/post-installation:ro
      - ./skeleton:/opt/nextcloud-skeleton:ro
      - ./informes:/opt/project-reports:ro
      - ../../docs:/opt/project-docs:ro
      - ../incidencias/matriz_amenazas.md:/opt/project-extra/matriz_amenazas.md:ro
      - ../monitoring/README.md:/opt/project-extra/INFORME-MONITOREO.md:ro
    networks:
      - gymbro-nextcloud-net

volumes:
  nextcloud_data:

networks:
  gymbro-nextcloud-net:
    driver: bridge
