# ==============================================================================
# SMARTGYMBRO - CONFIGURACION HAPROXY (BALANCEADOR Y ENRUTADOR DE ALTA DISPONIBILIDAD)
# ==============================================================================
global
    log stdout format raw local0

defaults
    log global
    mode tcp
    timeout connect 10s
    timeout client 30m
    timeout server 30m
    timeout check 5s

# ------------------------------------------------------------------------------
# PUERTO DE ESCRITURA (5000 y 5432) -> SOLO AL NODO PRIMARIO / MASTER
# ------------------------------------------------------------------------------
frontend postgres_write
    bind *:5000
    bind *:5432
    default_backend patroni_primary

backend patroni_primary
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server db1 db-node1:5432 check port 8008
    server db2 db-node2:5432 check port 8008
    server db3 db-node3:5432 check port 8008

# ------------------------------------------------------------------------------
# PUERTO DE LECTURA (5001) -> BALANCEO ENTRE REPLICAS
# ------------------------------------------------------------------------------
frontend postgres_read
    bind *:5001
    default_backend patroni_replicas

backend patroni_replicas
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2
    server db1 db-node1:5432 check port 8008
    server db2 db-node2:5432 check port 8008
    server db3 db-node3:5432 check port 8008

# ------------------------------------------------------------------------------
# PANEL WEB DE MONITOREO Y ESTADISTICAS HAPROXY
# ------------------------------------------------------------------------------
listen stats
    bind *:7000
    mode http
    stats enable
    stats uri /
    stats refresh 5s
