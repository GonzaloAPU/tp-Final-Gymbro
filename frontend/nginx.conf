server {
    listen 80;
    server_name localhost;

    # Dónde están los archivos HTML/JS compilados de Angular
    root /usr/share/nginx/html;
    index index.html;

    # 1. Evita el error 404 al recargar pantalla o navegar en rutas de Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Redirección interna hacia el contenedor del Backend
    location /api/ {
        proxy_pass http://backend:3100/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}